# Portable reconstruction for Linux with an NVIDIA GPU, based on the supplied
# dependency export. This is NOT an export of a newly validated environment.
# Python 3.8 is inferred from the archived Python 3.8 bytecode and package era;
# confirm the exact Python/CUDA versions on the authors' working Linux server.
# Run `conda env create -f environment.yml` from this repository's root.
name: myoecg
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
      # Preserve the original CUDA 11.3 PyTorch release pair. A compatible
      # NVIDIA driver is required; a separate local CUDA toolkit is not used
      # by these prebuilt wheels for ordinary inference/training.
      - "--extra-index-url https://download.pytorch.org/whl/cu113"
      - "torch==1.12.0+cu113"
      - "torchvision==0.13.0+cu113"
      # Includes core training/alignment and the six SimpleTest model imports.
      - "-r requirements-baselines.txt"
